<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#272736" />
    <meta
      name="description"
      content="Dusko Ilieski (DK) — photographer. Automotive, portrait, sport and street photography shot on a Canon R50 with a Tamron 17-70mm f/2.8."
    />
    <meta property="og:title" content="DK — Photography Portfolio" />
    <meta
      property="og:description"
      content="Automotive, portrait, sport and street photography by Dusko Ilieski."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>DK — Photography Portfolio</title>
    <script>
      (function () {
        var d = document.documentElement;
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        d.dataset.theme = t;
        d.style.background = t === 'light' ? '#ffffeb' : '#272736';
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('js-motion');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
